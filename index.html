<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA</title>
<meta name="theme-color" content="#08111e">
<meta name="description" content="GA — generic app shell. Random picture.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!--
  GA — generic app shell (model).
  ─────────────────────────────────────────────
  HOW TO REPLACE THE FUNCTION:
  Everything between the APP BODY markers below is the entire "function"
  of this app. Delete it and drop in new markup + script; the shell
  (head, PWA wiring, styles) stays as-is.
  NOTE: no apple-touch-icon PNG is referenced on purpose — iOS falls back
  to the page-preview thumbnail, which beats a broken icon.
-->
<style>
  :root{
    --bg:#08111e; --card:#0f1d33; --line:#1e3a5f;
    --text:#e2e8f0; --dim:#8fa3bf; --accent:#38bdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100dvh; padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .wrap{max-width:560px;margin:0 auto;}
  header{text-align:center;margin:8px 0 20px;}
  header h1{margin:0;font-size:44px;letter-spacing:6px;}
  header p{margin:6px 0 0;color:var(--dim);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:16px;
  }
  .card h2{margin:0 0 12px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
  button{
    width:100%; border:none; border-radius:12px; padding:16px;
    font-size:18px; font-weight:700; font-family:inherit;
    background:var(--accent); color:#04121f; cursor:pointer;
  }
  button:active{transform:scale(.98);}
  button:disabled{opacity:.55;}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:22px;line-height:1.6;}

  /* ── random picture ── */
  .frame{
    position:relative; border-radius:12px; overflow:hidden;
    background:#0a1526; border:1px solid var(--line);
    aspect-ratio:4/3; margin-bottom:14px;
  }
  .frame img{
    width:100%; height:100%; object-fit:cover; display:block;
    opacity:0; transition:opacity .35s ease;
  }
  .frame.ready img{opacity:1;}
  .frame .status{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:15px; text-align:center; padding:0 24px;
  }
  .frame.ready .status{display:none;}
  .frame .status .spin{
    width:34px; height:34px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--accent);
    animation:spin 0.9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .credit{margin-top:10px;font-size:12px;color:var(--dim);text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GA</h1>
    <p>generic app</p>
  </header>

  <!-- ═══════════ APP BODY — replace everything in this block ═══════════ -->
  <section class="card" aria-label="Random picture">
    <h2>Random picture</h2>
    <div class="frame" id="frame">
      <img id="photo" alt="Random picture from the internet">
      <div class="status" id="status"><div class="spin" role="status" aria-label="Loading"></div></div>
    </div>
    <button id="refreshBtn" type="button">↻ New picture</button>
    <div class="credit" id="credit"></div>
  </section>
  <!-- ═══════════ END APP BODY ═══════════ -->

  <footer>Model shell — swap the app body to install a new function.<br>Works offline.</footer>
</div>

<script>
// ── GA model shell: random picture ─────────────────────────────
const $ = id => document.getElementById(id);
const frame = $('frame'), photo = $('photo'),
      status = $('status'), btn = $('refreshBtn'), credit = $('credit');

function statusText(msg) {
  status.innerHTML = '';
  status.textContent = msg;
}
function statusSpinner() {
  status.innerHTML = '<div class="spin" role="status" aria-label="Loading"></div>';
}

function newPicture() {
  const seed = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const url = 'https://picsum.photos/seed/' + seed + '/1200/900';
  btn.disabled = true;
  frame.classList.remove('ready');
  statusSpinner();
  credit.textContent = '';

  const probe = new Image();
  probe.onload = () => {
    photo.src = url;
    frame.classList.add('ready');
    credit.textContent = 'Photo: Lorem Picsum';
    btn.disabled = false;
  };
  probe.onerror = () => {
    statusText('Could not load a picture. Check your connection and try again.');
    btn.disabled = false;
  };
  probe.src = url;
}

btn.addEventListener('click', newPicture);
photo.addEventListener('click', newPicture);

newPicture();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
  // When a newer app version takes over, reload so the new function shows immediately.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    location.reload();
  });
}
</script>
</body>
</html>
