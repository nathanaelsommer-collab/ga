<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA</title>
<meta name="theme-color" content="#08111e">
<meta name="description" content="GA — big ticker screen: SOXL, SOXS, VOO, NVDA, refreshed every minute.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!--
  GA — generic app shell (model).
  ─────────────────────────────────────────────
  HOW TO REPLACE THE FUNCTION:
  Everything between the APP BODY markers below is the entire "function"
  of this app. Delete it and drop in new markup + script; the shell
  (head, PWA wiring, styles) stays as-is.
  NOTE: no apple-touch-icon PNG is referenced on purpose — iOS falls back
  to the page-preview thumbnail, which beats a broken icon.
-->
<style>
  :root{
    --bg:#08111e; --card:#0f1d33; --line:#1e3a5f;
    --text:#e2e8f0; --dim:#8fa3bf; --accent:#38bdf8; --danger:#f87171;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100dvh; padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .wrap{max-width:560px;margin:0 auto;}
  header{text-align:center;margin:8px 0 20px;}
  header h1{margin:0;font-size:44px;letter-spacing:6px;}
  header p{margin:6px 0 0;color:var(--dim);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:16px;
  }
  .card h2{margin:0 0 12px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;}
  input,select{
    width:100%; background:#0a1526; color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    font-size:17px; padding:13px 14px; font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  button{
    border:none; border-radius:12px; padding:15px;
    font-size:17px; font-weight:700; font-family:inherit;
    background:var(--accent); color:#04121f; cursor:pointer;
  }
  button:active{transform:scale(.98);}
  button:disabled{opacity:.55;}
  .row{margin-top:14px;}
  .row button{width:100%;}
  .ghost{background:transparent;color:var(--dim);border:1px solid var(--line);font-weight:400;font-size:14px;padding:11px;}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:22px;line-height:1.6;}
  a{color:var(--accent);}

  /* ── shared ── */
  .today{font-size:15px;color:var(--dim);margin-bottom:6px;}
  .hint{margin-top:8px;font-size:13px;color:var(--dim);line-height:1.5;}
  .sub{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.5;}
  textarea{
    width:100%; background:#0a1526; color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    font-size:16px; padding:13px 14px; font-family:inherit; min-height:84px; resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--accent);}
  pre.report{
    background:#0a1526;border:1px solid var(--line);border-radius:10px;
    padding:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);margin:0;
  }
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  .btnrow button{flex:1;padding:13px 8px;font-size:15px;}
  .histrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer;}
  .histrow:last-child{border-bottom:none;}
  .histrow .d{font-weight:700;}
  .histrow .v{color:var(--dim);}
  .big{font-size:20px;font-weight:700;}
  .muted{color:var(--dim);}

  /* ── Ticker screen (ga-v17) ── */
  .tick{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:16px 20px 18px; margin-bottom:14px;
  }
  .tick .sym{font-size:30px;font-weight:800;letter-spacing:2px;}
  .tick .sess{float:right;font-size:13px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;padding-top:10px;}
  .tick .price{font-size:68px;font-weight:800;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:2px;}
  .tick .chg{font-size:30px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
  .up{color:#22c55e;}
  .down{color:#f87171;}
  .flat{color:var(--dim);}
  .status{text-align:center;color:var(--dim);font-size:14px;margin-top:4px;line-height:1.7;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GA</h1>
    <p>generic app</p>
  </header>

  <!-- ═══════════ APP BODY — replace everything in this block ═══════════ -->
  <div id="tickList"></div>

  <div class="status" id="statusLine">Loading…</div>
  <div class="row"><button class="ghost" id="refreshBtn" type="button">↻ Refresh now</button></div>
  <div class="status">Refreshes every 60 seconds.<br>Prices are delayed — check Schwab for the live mark.</div>

  <section class="card" aria-label="Latest from you">
    <h2>Latest from you</h2>
    <div id="syncBody"><div class="hint">No synced info yet.</div></div>
    <div class="hint" id="syncMeta"></div>
  </section>
  <!-- ═══════════ END APP BODY ═══════════ -->

  <footer>
    SOXL · SOXS · VOO · NVDA<br>
    <a href="https://nathanaelsommer-collab.github.io/ga/">nathanaelsommer-collab.github.io/ga/</a>
  </footer>
</div>

<script>
// ── GA model shell: big ticker screen (ga-v17) ──────────
// SOXL, SOXS, VOO, NVDA. Large font, one row each, refreshed every 60s.
// Free quote sources are flaky — try them in order, keep the last good
// values on screen, and say plainly when a refresh couldn't get through.
const $ = id => document.getElementById(id);
const SYMBOLS = ['SOXL', 'SOXS', 'VOO', 'NVDA'];
const STORE_KEY = 'ga_tickers_v17';
const YAHOO_URL = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + SYMBOLS.join(',');
const PROXY_URL = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(YAHOO_URL);
const STOOQ_URL = 'https://stooq.com/q/l/?s=soxl.us,soxs.us,voo.us,nvda.us&f=sd2t2ohlcv&h&e=csv';

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtPrice(n){ return Number(n).toFixed(2); }
function fmtChg(n){ return (n >= 0 ? '+' : '−') + '$' + Math.abs(n).toFixed(2); }
function fmtPct(n){ return (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(2) + '%'; }
function fmtTime(d){
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0'); const s = String(d.getSeconds()).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + m + ':' + s + ' ' + ap;
}

// Pick the price to show for a Yahoo quote row: pre-market / after-hours
// when the market is in that session, otherwise the regular price.
// Change is always measured against the previous close.
function pickDisplay(r){
  const prev = r.regularMarketPreviousClose;
  const state = r.marketState || '';
  let price = r.regularMarketPrice;
  let session = 'CLOSED';
  if (state === 'PRE' && isFinite(r.preMarketPrice)) { price = r.preMarketPrice; session = 'PRE-MARKET'; }
  else if (state === 'POST' && isFinite(r.postMarketPrice)) { price = r.postMarketPrice; session = 'AFTER HOURS'; }
  else if (state === 'REGULAR') { session = 'MARKET OPEN'; }
  else if (state === 'PRE') { session = 'PRE-MARKET'; }
  else if (state === 'POST') { session = 'AFTER HOURS'; }
  const chg = (isFinite(price) && isFinite(prev)) ? price - prev : null;
  const pct = (chg != null && prev) ? chg / prev * 100 : null;
  return { price: price, chg: chg, pct: pct, session: session };
}
function parseYahooQuote(json){
  const out = {};
  const res = json && json.quoteResponse && json.quoteResponse.result;
  (res || []).forEach(function(r){
    if (!r || !r.symbol) return;
    const d = pickDisplay(r);
    if (isFinite(d.price)) out[String(r.symbol).toUpperCase()] = d;
  });
  return out;
}
// Stooq CSV: Symbol,Date,Time,Open,High,Low,Close,Volume — close only,
// no change available, so chg/pct stay null and render as —.
function parseStooq(csv){
  const out = {};
  const rows = String(csv || '').trim().split(/\r?\n/);
  for (let i = 1; i < rows.length; i++) {
    const c = rows[i].split(',');
    if (c.length < 7) continue;
    const sym = String(c[0] || '').replace(/\.us$/i, '').toUpperCase();
    const close = parseFloat(c[6]);
    if (sym && isFinite(close)) out[sym] = { price: close, chg: null, pct: null, session: 'DELAYED' };
  }
  return out;
}

function fetchWithTimeout(url, ms, asJson){
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, ms);
  const opts = ctrl ? { signal: ctrl.signal } : {};
  return fetch(url, opts).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return asJson ? r.json() : r.text();
  }).finally(function(){ clearTimeout(timer); });
}

function loadCache(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch(e){ return null; }
}
function saveCache(quotes){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ ts: Date.now(), quotes: quotes })); } catch(e){}
}

// ── Synced info (data.json) ──
// The latest information the user has shared in chat, written to data.json
// and pulled fresh on every refresh. Same-origin, so it loads reliably;
// the service worker never caches it.
const SYNC_KEY = 'ga_data_v18';
function loadSyncCache(){
  try { return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch(e){ return null; }
}
function saveSyncCache(d){
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(d)); } catch(e){}
}
function money2(n){ return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function dataHtml(d){
  if (!d) return '<div class="hint">No synced info yet.</div>';
  const parts = [];
  if (d.account) {
    const a = d.account;
    parts.push('<div class="fact"><span class="k">Account total</span><span class="v">' + esc(a.totalNote || ('$' + Number(a.total).toLocaleString('en-US'))) + '</span></div>');
    if (a.cash != null) parts.push('<div class="fact"><span class="k">Cash</span><span class="v">$' + Number(a.cash).toLocaleString('en-US') + '</span></div>');
    if (a.checkpoint != null) parts.push('<div class="fact"><span class="k">' + esc(a.checkpointDate || 'Checkpoint') + ' checkpoint</span><span class="v">$' + Number(a.checkpoint).toLocaleString('en-US') + (a.checkpointNote ? ' — ' + esc(a.checkpointNote) : '') + '</span></div>');
  }
  (d.holdings || []).forEach(function(h){
    parts.push('<div class="fact"><span class="k">' + esc(h.sym) + ' · ' + esc(String(h.shares)) + ' sh @ $' + fmtPrice(h.price) + '</span><span class="v">$' + money2(h.value) + '</span></div>');
  });
  (d.flips || []).forEach(function(f){
    parts.push('<div class="fact"><span class="k">' + esc(f.sym) + ' limit $' + fmtPrice(f.entry) + ' × ' + esc(String(f.shares)) + '</span><span class="v">' + esc(f.status || '') + '</span></div>');
    parts.push('<div class="sub">Half $' + fmtPrice(f.half) + ' · rest $' + fmtPrice(f.rest) + ' · stop $' + fmtPrice(f.stop) + '</div>');
  });
  if (d.voo) parts.push('<div class="fact"><span class="k">VOO · ' + esc(String(d.voo.shares)) + ' sh</span><span class="v">' + esc(d.voo.status || '') + '</span></div>');
  (d.notes || []).forEach(function(n){ parts.push('<div class="sub">• ' + esc(n) + '</div>'); });
  return parts.join('');
}
function renderSync(d, meta){
  $('syncBody').innerHTML = dataHtml(d);
  if (meta) $('syncMeta').textContent = meta;
}
function fetchData(){
  if (typeof fetch !== 'function') return;
  fetchWithTimeout('./data.json', 5000, true).then(function(d){
    if (!d) throw new Error('empty');
    saveSyncCache(d);
    renderSync(d, 'Updated ' + (d.updatedLabel || '') + ' · ' + (d.source || ''));
  }).catch(function(){
    const c = loadSyncCache();
    if (c) renderSync(c, 'Showing last sync ' + (c.updatedLabel || '') + ' — couldn’t refresh.');
    else renderSync(null, '');
  });
}

function render(quotes, meta){
  const box = $('tickList');
  const rows = SYMBOLS.map(function(sym){
    const q = quotes && quotes[sym];
    const price = q ? fmtPrice(q.price) : '—';
    let chgHtml;
    if (q && q.chg != null && q.pct != null) {
      const cls = q.chg > 0 ? 'up' : q.chg < 0 ? 'down' : 'flat';
      chgHtml = '<div class="chg ' + cls + '">' + esc(fmtChg(q.chg)) + ' (' + esc(fmtPct(q.pct)) + ')</div>';
    } else {
      chgHtml = '<div class="chg flat">—</div>';
    }
    const sess = q ? q.session : '';
    return '<div class="tick"><span class="sess">' + esc(sess) + '</span>' +
      '<div class="sym">' + esc(sym) + '</div>' +
      '<div class="price">' + esc(price) + '</div>' + chgHtml + '</div>';
  }).join('');
  box.innerHTML = rows;
  if (meta) $('statusLine').textContent = meta;
}

// ── Server-side quotes (prices.json) ──
// A GitHub Action fetches quotes every 5 minutes during market hours and
// writes them to prices.json in this repo. The app reads its own file
// (same-origin, always works) instead of asking free quote sites from the
// browser, where Yahoo rate-limits (429), the AllOrigins proxy is blocked,
// and Stooq is dead (404). The browser sources below stay as fallback.
function parsePricesJson(d){
  if (!d || !d.quotes) return null;
  const quotes = {};
  SYMBOLS.forEach(function(s){
    const q = d.quotes[s];
    if (!q || typeof q.price !== 'number') return;
    // Same display shape as pickDisplay: session price, change measured
    // against the previous close, session label.
    const prev = q.prevClose;
    let price = q.price, session = 'CLOSED';
    if (q.state === 'PRE' && isFinite(q.preMarketPrice)) { price = q.preMarketPrice; session = 'PRE-MARKET'; }
    else if (q.state === 'POST' && isFinite(q.postMarketPrice)) { price = q.postMarketPrice; session = 'AFTER HOURS'; }
    else if (q.state === 'REGULAR') { session = 'MARKET OPEN'; }
    else if (q.state === 'PRE') { session = 'PRE-MARKET'; }
    else if (q.state === 'POST') { session = 'AFTER HOURS'; }
    const chg = (isFinite(price) && isFinite(prev)) ? price - prev : null;
    const pct = (chg != null && prev) ? chg / prev * 100 : null;
    quotes[s] = { price: price, chg: chg, pct: pct, session: session };
  });
  if (Object.keys(quotes).length === 0) return null;
  return { quotes: quotes, source: 'GitHub', updatedLabel: d.updatedLabel || '', updated: d.updated || '' };
}
function fetchPricesJson(){
  return fetchWithTimeout('./prices.json', 5000, true)
    .then(function(d){ return parsePricesJson(d); })
    .catch(function(){ return null; });
}

function trySources(){
  return fetchPricesJson().then(function(p){
    if (p) return p;
    return fetchWithTimeout(YAHOO_URL, 5000, true)
      .then(function(json){ return { quotes: parseYahooQuote(json), source: 'Yahoo' }; })
      .catch(function(){
        return fetchWithTimeout(PROXY_URL, 6000, true)
          .then(function(json){ return { quotes: parseYahooQuote(json), source: 'Yahoo (proxy)' }; })
          .catch(function(){
            return fetchWithTimeout(STOOQ_URL, 5000, false)
              .then(function(csv){ return { quotes: parseStooq(csv), source: 'Stooq' }; });
          });
      });
  })
  .then(function(res){
    if (!res || !res.quotes || Object.keys(res.quotes).length === 0) throw new Error('no quotes');
    return res;
  });
}

// ── Self-update ──
// The app keeps an offline copy on the phone (service worker). Without this,
// a new version can sit on the server unnoticed while the old copy keeps
// serving. So the app asks for updates itself on load and on every refresh;
// when a new version takes over, the page reloads once to show it.
let reloadingForUpdate = false;
function checkForUpdate(){
  try {
    if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistration().then(function(r){
      if (r) r.update();
    }).catch(function(){});
  } catch(e){}
}
function watchForUpdate(){
  try {
    if (typeof navigator === 'undefined' || !('serviceWorker' in navigator)) return;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if (!reloadingForUpdate) { reloadingForUpdate = true; window.location.reload(); }
    });
  } catch(e){}
}

let refreshing = false;
function refresh(){
  if (refreshing) return;
  if (typeof fetch !== 'function') return;
  refreshing = true;
  $('statusLine').textContent = 'Updating…';
  fetchData();
  checkForUpdate();
  trySources().then(function(res){
    saveCache(res.quotes);
    let status = 'Updated ' + fmtTime(new Date()) + ' · via ' + res.source;
    if (res.updated) {
      const ageMin = Math.max(0, Math.round((Date.now() - Date.parse(res.updated)) / 60000));
      status += ' · prices ' + (ageMin <= 1 ? 'just now' : ageMin + ' min old');
    }
    render(res.quotes, status);
  }).catch(function(){
    const cache = loadCache();
    if (cache && cache.quotes) {
      render(cache.quotes, 'Couldn’t refresh — showing last update ' + fmtTime(new Date(cache.ts)) + '. Tap ↻ to retry.');
    } else {
      render(null, 'Couldn’t load prices — tap ↻ Refresh now to retry.');
    }
  }).finally(function(){ refreshing = false; });
}

$('refreshBtn').addEventListener('click', function(){ refresh(); });

// Show the last good values instantly, then fetch fresh ones.
(function init(){
  const sync = loadSyncCache();
  renderSync(sync, sync ? 'Last sync ' + (sync.updatedLabel || '') + ' — refreshing…' : '');
  const cache = loadCache();
  if (cache && cache.quotes) {
    render(cache.quotes, 'Last update ' + fmtTime(new Date(cache.ts)) + ' — refreshing…');
  } else {
    render(null, 'Loading…');
  }
  if (typeof fetch === 'function') {
    refresh();
    if (typeof setInterval === 'function') setInterval(refresh, 60000);
    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('visibilitychange', function(){
        if (!document.hidden) refresh();
      });
    }
  }
  watchForUpdate();
  checkForUpdate();
})();
</script>
</body>
</html>
