<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GA</title>
<meta name="theme-color" content="#08111e">
<meta name="description" content="GA — generic app shell. Search and quick email.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<!--
  GA — generic app shell (model).
  ─────────────────────────────────────────────
  HOW TO REPLACE THE FUNCTION:
  Everything between the APP BODY markers below is the entire "function"
  of this app. Delete it and drop in new markup + script; the shell
  (head, PWA wiring, styles) stays as-is.
  NOTE: no apple-touch-icon PNG is referenced on purpose — iOS falls back
  to the page-preview thumbnail, which beats a broken icon.
-->
<style>
  :root{
    --bg:#08111e; --card:#0f1d33; --line:#1e3a5f;
    --text:#e2e8f0; --dim:#8fa3bf; --accent:#38bdf8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100dvh; padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 24px);
  }
  .wrap{max-width:560px;margin:0 auto;}
  header{text-align:center;margin:8px 0 20px;}
  header h1{margin:0;font-size:44px;letter-spacing:6px;}
  header p{margin:6px 0 0;color:var(--dim);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:16px;
  }
  .card h2{margin:0 0 12px;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);}
  label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px;}
  label:first-of-type{margin-top:0;}
  input,textarea{
    width:100%; background:#0a1526; color:var(--text);
    border:1px solid var(--line); border-radius:10px;
    font-size:17px; padding:13px 14px; font-family:inherit;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);}
  textarea{min-height:110px;resize:vertical;}
  .row{display:flex;gap:10px;margin-top:14px;}
  button{
    flex:1; border:none; border-radius:12px; padding:15px;
    font-size:17px; font-weight:700; font-family:inherit;
    background:var(--accent); color:#04121f; cursor:pointer;
  }
  button:active{transform:scale(.98);}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:22px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GA</h1>
    <p>generic app</p>
  </header>

  <!-- ═══════════ APP BODY — replace everything in this block ═══════════ -->
  <section class="card" aria-label="Search">
    <h2>Search</h2>
    <input id="q" type="search" placeholder="Type to search…" autocomplete="off"
           enterkeyhint="search">
    <div class="row">
      <button id="searchBtn" type="button">Search</button>
    </div>
  </section>

  <section class="card" aria-label="Email">
    <h2>Email</h2>
    <label for="to">To</label>
    <input id="to" type="email" autocomplete="email" enterkeyhint="next">
    <label for="subject">Subject</label>
    <input id="subject" type="text" autocomplete="off" enterkeyhint="next">
    <label for="body">Message</label>
    <textarea id="body" enterkeyhint="enter"></textarea>
    <div class="row">
      <button id="mailBtn" type="button">Send email</button>
    </div>
  </section>
  <!-- ═══════════ END APP BODY ═══════════ -->

  <footer>Model shell — swap the app body to install a new function.<br>Works offline.</footer>
</div>

<script>
// ── GA model shell ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
const TO_KEY = 'ga_default_to';
const DEFAULT_TO = 'nathanael.sommer@gmail.com';

// Restore the last-used address (default on first run).
try { $('to').value = localStorage.getItem(TO_KEY) || DEFAULT_TO; }
catch (e) { $('to').value = DEFAULT_TO; }

function doSearch() {
  const q = $('q').value.trim();
  if (!q) return;
  location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
}

function doMail() {
  const to = $('to').value.trim() || DEFAULT_TO;
  try { localStorage.setItem(TO_KEY, to); } catch (e) { /* private mode */ }
  const subject = $('subject').value.trim();
  const body = $('body').value;
  const params = [];
  if (subject) params.push('subject=' + encodeURIComponent(subject));
  if (body) params.push('body=' + encodeURIComponent(body));
  location.href = 'mailto:' + to + (params.length ? '?' + params.join('&') : '');
}

$('searchBtn').addEventListener('click', doSearch);
$('mailBtn').addEventListener('click', doMail);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
